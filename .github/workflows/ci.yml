name: Rust
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo build --locked --release
      - name: Audit public files
        if: runner.os == 'Linux'
        run: python3 scripts/check_public_files.py
      - name: Study workflow terminal check
        if: runner.os == 'Linux'
        run: python3 tests/tui_smoke.py target/release/kaiser
      - name: Configuration terminal check
        if: runner.os == 'Linux'
        run: python3 tests/config_smoke.py target/release/kaiser
      - name: Logo terminal check
        if: runner.os == 'Linux'
        run: python3 tests/logo_smoke.py target/release/kaiser
      - name: Demo terminal check
        if: runner.os == 'Linux'
        run: python3 tests/demo_smoke.py target/release/kaiser
