[package]
name = "kaiser"
version = "0.1.0"
edition = "2024"
description = "A quiet terminal workspace for understanding and remembering"
license = "MIT AND CC-BY-SA-4.0"
repository = "https://github.com/LThmly/Kaiser"
homepage = "https://github.com/LThmly/Kaiser"
readme = "README.md"
keywords = ["tui", "study", "flashcards", "learning", "notes"]
categories = ["command-line-utilities"]
include = [
    "/src/**", "/assets/**", "/config/config.toml", "/config/themes/kaiser-*.toml", "/tests/fixtures/**",
    "/docs/**", "/Cargo.toml", "/Cargo.lock", "/LICENSE", "/README.md", "/CONTRIBUTING.md",
    "!**/[Aa][Gg][Ee][Nn][Tt][Ss]*.[Mm][Dd]",
    "!**/[Cc][Ll][Aa][Uu][Dd][Ee]*.[Mm][Dd]",
    "!**/[Cc][Oo][Dd][Ee][Xx]*.[Mm][Dd]",
    "!**/[Gg][Ee][Mm][Ii][Nn][Ii]*.[Mm][Dd]",
    "!**/[Mm][Ee][Mm][Oo][Rr][Yy].[Mm][Dd]", "!**/copilot-instructions.md",
    "!**/state.json", "!**/auth/**", "!**/notebooks/**", "!**/.env*",
    "!**/.agents/**", "!**/.claude/**", "!**/.codex/**", "!**/.cursor/**",
    "!**/.aws/**", "!**/.gemini/**", "!**/.opencode/**", "!**/.roo/**",
    "!**/__pycache__/**", "!**/*.pyc",
]

[dependencies]
ratatui = "0.30"
pulldown-cmark = { version = "0.13", default-features = false }
ratatui-image = { version = "11", default-features = false, features = ["crossterm"] }
crossterm = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22.1"
ring = "0.17.14"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
textwrap = "0.16"
unicode-width = "0.2"
toml = "1.1"
zip = { version = "8", default-features = false, features = ["deflate"] }
quick-xml = "0.39"
pdf-extract = "0.12"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "tiff", "bmp", "webp", "pnm"] }
ocrs = { version = "0.13", default-features = false, features = ["onnx"] }
rten = { version = "0.26", default-features = false, features = ["onnx_format"] }
hayro = "0.8"

[profile.release]
lto = "thin"
strip = true
